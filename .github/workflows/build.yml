name: Build and Release Arch Linux Package

on:
  push:
    branches: [ main, master ]
    paths:
      - 'PKGBUILD'
      - 'policies.json'
      - 'impostazioni.js'
      - 'rischio-fox.js'

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write # Necessario per creare la release e caricare i file

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm archlinux-keyring
          pacman -S --noconfirm base-devel git sudo

      - name: Create non-root user and fix permissions
        run: |
          useradd -m builder
          passwd -d builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' >> /etc/sudoers
          chown -R builder:builder .

      - name: Build package with makepkg
        run: |
          su builder -c "makepkg -s --noconfirm"

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stable
          files: '*.pkg.tar.zst'
          body: 'Aggiornamento automatico del pacchetto Arch Linux.'
          fail_on_unmatched_files: true
