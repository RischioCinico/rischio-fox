name: Build and Update Arch Repo

on:
  push:
    branches: [ main, master ]
    paths:
      - 'PKGBUILD'
      - 'policies.json'
      - 'impostazioni.js'
      - 'rischio-fox.js'

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm archlinux-keyring
          pacman -S --noconfirm base-devel git sudo

      - name: Create non-root user and fix permissions
        run: |
          useradd -m builder
          passwd -d builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' >> /etc/sudoers
          chown -R builder:builder .

      - name: Build package with makepkg
        run: |
          su builder -c "makepkg -s --noconfirm"

      - name: Prepare Repository Files
        run: |
          mkdir -p repo
          mv *.pkg.tar.zst repo/
          cd repo
          repo-add rischio-repo.db.tar.gz *.pkg.tar.zst

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update package and repository database [skip ci]"
          file_pattern: "repo/*"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
