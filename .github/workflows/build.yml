name: Build and Update Arch Repo

on:
  push:
    branches: [ main, master ]
    paths:
      - 'PKGBUILD'
      - 'policies.json'
      - 'impostazioni.js'
      - 'rischio-fox.js'

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm archlinux-keyring
          pacman -S --noconfirm base-devel git sudo

      - name: Create non-root user and fix permissions
        run: |
          useradd -m builder
          passwd -d builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' >> /etc/sudoers
          chown -R builder:builder .

      - name: Build package with makepkg
        run: |
          su builder -c "makepkg -s --noconfirm"

      - name: Create package database and commit back
        run: |
          # Sposta il pacchetto compilato in una cartella dedicata al repo
          mkdir -p repo
          mv *.pkg.tar.zst repo/
          cd repo
          
          # Genera il database del repository
          repo-add rischio-repo.db.tar.gz *.pkg.tar.zst
          
          # Configura git per il bot di GitHub Actions
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout main || git checkout master
          
          # Aggiunge i file compilati e il db al repository git
          git add .
          git commit -m "Auto-update package and repository database [skip ci]"
          git push
